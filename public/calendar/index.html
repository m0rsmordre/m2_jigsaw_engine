<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fishing Calendar — Balık Yapboz Yardımcısı</title>
  <meta name="description" content="Next Fish Jigsaw fishing events for Ezel/Barbaros, Marmara/Bagjanamu, Charon servers with live countdowns in TR/EN." />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="stylesheet" href="/site.css" />
  <script>
    window.PAGE_I18N = {
      tr: {
        docTitle: 'Takvim — Balık Yapboz Yardımcısı',
        pageTitle: 'Balıkçılık etkinlik takvimi',
        intro: 'Wiki ve resmi forum takvimlerinden derlenmiştir. Avrupa saatleri TSİ’ye çevrilir. Sayaçlar canlıdır.',
        note: 'Kaynak: Metin2 Wiki / forum — global özel etkinlik duyurusu varsa takvim geçersiz kalabilir.',
        ezelTitle: 'Ezel / Barbaros',
        marmaraTitle: 'Marmara / Bagjanamu',
        charonTitle: 'Charon / Lucifer / Safir / Star',
        nextTitle: 'Gelecek Balık Yapboz Etkinliği',
        empty: 'Yaklaşan balıkçılık etkinliği bulunamadı.',
        untilStart: 'sonra etkinlik başlayacak',
        untilEnd: 'sonra etkinlik bitecek',
        ended: 'Etkinlik bitti',
        dayUnit: 'gün',
        hourUnit: 'saat',
        minUnit: 'dakika',
        secUnit: 'saniye',
      },
      en: {
        docTitle: 'Calendar — Fish Jigsaw Helper',
        pageTitle: 'Fishing event calendar',
        intro: 'Compiled from the Metin2 Wiki and official forum. Europe times are converted to Turkey time (TSİ). Countdowns update live.',
        note: 'Source: Metin2 Wiki / forum — global special events may override this schedule.',
        ezelTitle: 'Ezel / Barbaros',
        marmaraTitle: 'Marmara / Bagjanamu',
        charonTitle: 'Charon / Lucifer / Safir / Star',
        nextTitle: 'Next Fishing Jigsaw',
        empty: 'No upcoming fishing events found.',
        untilStart: 'until the event starts',
        untilEnd: 'until the event ends',
        ended: 'Event ended',
        dayUnit: 'd',
        hourUnit: 'h',
        minUnit: 'm',
        secUnit: 's',
      },
    }
  </script>
  <script src="/lang.js" defer></script>
</head>
<body>
  <div class="wrap">
    <header>
      <h1><a href="/" data-i18n="brand">Balık Yapboz Yardımcısı</a></h1>
      <nav>
        <a href="/" data-i18n="navPlay">Oyna</a>
        <a href="/how-to/" data-i18n="navHowTo">Nasıl oynanır?</a>
        <a href="/rules/" data-i18n="navRules">Kurallar</a>
        <a href="/calendar/" data-i18n="navCalendar">Takvim</a>
        <a href="/about/" data-i18n="navAbout">Hakkımızda</a>
        <a href="/contact/" data-i18n="navContact">İletişim</a>
        <div class="lang-switch" role="group" aria-label="Language">
          <button type="button" data-lang-btn="tr"></button>
          <button type="button" data-lang-btn="en"></button>
        </div>
      </nav>
    </header>

    <article>
      <h2 data-i18n="pageTitle">Balıkçılık etkinlik takvimi</h2>
      <p data-i18n="intro"></p>
      <p class="note" data-i18n="note"></p>
    </article>

    <article>
      <h2 data-i18n="ezelTitle">Ezel / Barbaros</h2>
      <h3 data-i18n="nextTitle">Next Fishing Jigsaw</h3>
      <div id="ezel-list"></div>
    </article>

    <article>
      <h2 data-i18n="marmaraTitle">Marmara / Bagjanamu</h2>
      <h3 data-i18n="nextTitle">Next Fishing Jigsaw</h3>
      <div id="marmara-list"></div>
    </article>

    <article>
      <h2 data-i18n="charonTitle">Charon / Lucifer / Safir / Star</h2>
      <h3 data-i18n="nextTitle">Next Fishing Jigsaw</h3>
      <div id="charon-list"></div>
    </article>

    <footer>
      <nav>
        <a href="/terms/" data-i18n="terms">Terms</a>
        <a href="/privacy/" data-i18n="privacy">Privacy</a>
        <a href="/cookie-policy/" data-i18n="cookies">Cookie Policy</a>
        <a href="/contact/" data-i18n="contact">Contact</a>
        <a href="/calendar/" data-i18n="calendar">Calendar</a>
      </nav>
      <p data-i18n="footerNote"></p>
    </footer>
  </div>

  <script>
  (function () {
    var IST = 'Europe/Istanbul'
    var BER = 'Europe/Berlin'
    var MAX = 2

    function europeLocalToDate(y, m, d, hour, minute) {
      var fmt = new Intl.DateTimeFormat('en-US', {
        timeZone: BER, year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
      })
      var t = Date.UTC(y, m - 1, d, hour, minute || 0)
      for (var i = 0; i < 6; i++) {
        var parts = {}
        fmt.formatToParts(new Date(t)).forEach(function (p) {
          if (p.type !== 'literal') parts[p.type] = p.value
        })
        var got = Date.UTC(+parts.year, +parts.month - 1, +parts.day, +parts.hour, +parts.minute)
        var want = Date.UTC(y, m - 1, d, hour, minute || 0)
        t += want - got
      }
      return new Date(t)
    }

    function berlinYmd(d) {
      var fmt = new Intl.DateTimeFormat('en-US', {
        timeZone: BER, year: 'numeric', month: '2-digit', day: '2-digit', weekday: 'short'
      })
      var parts = {}
      fmt.formatToParts(d).forEach(function (p) {
        if (p.type !== 'literal') parts[p.type] = p.value
      })
      return { y: +parts.year, m: +parts.month, day: +parts.day, wd: parts.weekday }
    }

    function fmtRange(start, end, lang) {
      var loc = lang === 'en' ? 'en-GB' : 'tr-TR'
      var day = new Intl.DateTimeFormat(loc, {
        timeZone: IST, weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
      }).format(start)
      var tf = new Intl.DateTimeFormat(loc, {
        timeZone: IST, hour: '2-digit', minute: '2-digit', hour12: false
      })
      return day + ' · ' + tf.format(start) + ' – ' + tf.format(end) + ' TSİ'
    }

    function t(lang, key) {
      return (window.PAGE_I18N[lang] && window.PAGE_I18N[lang][key]) || key
    }

    function countdownText(start, end, now, lang) {
      var mode, target
      if (now < start) { mode = 'start'; target = start }
      else if (now < end) { mode = 'end'; target = end }
      else return t(lang, 'ended')
      var s = Math.max(0, Math.floor((target - now) / 1000))
      var days = Math.floor(s / 86400)
      var hours = Math.floor((s % 86400) / 3600)
      var mins = Math.floor((s % 3600) / 60)
      var secs = s % 60
      if (lang === 'en') {
        var body = days + t(lang, 'dayUnit') + ' ' + hours + t(lang, 'hourUnit') + ' ' + mins + t(lang, 'minUnit') + ' ' + secs + t(lang, 'secUnit')
        return body + ' ' + t(lang, mode === 'start' ? 'untilStart' : 'untilEnd')
      }
      var bodyTr = days + ' ' + t(lang, 'dayUnit') + ' ' + hours + ' ' + t(lang, 'hourUnit') + ' ' + mins + ' ' + t(lang, 'minUnit') + ' ' + secs + ' ' + t(lang, 'secUnit')
      return bodyTr + ' ' + t(lang, mode === 'start' ? 'untilStart' : 'untilEnd')
    }

    function cardHtml(title, start, end, now, lang) {
      return '<div class="event-card">' +
        '<div><strong class="fish">' + title + '</strong></div>' +
        '<div class="muted">' + fmtRange(start, end, lang) + '</div>' +
        '<div class="countdown" data-start="' + start.getTime() + '" data-end="' + end.getTime() + '">' +
        countdownText(start.getTime(), end.getTime(), now, lang) + '</div></div>'
    }

    function fill(el, items, now, lang) {
      var html = ''
      items.slice(0, MAX).forEach(function (it) {
        html += cardHtml(it.title, it.start, it.end, now, lang)
      })
      el.innerHTML = html || '<p class="muted">' + t(lang, 'empty') + '</p>'
    }

    var ezel = [
      ['2026-03-22T22:00:00+03:00', '2026-03-23T02:00:00+03:00'],
      ['2026-04-19T21:00:00+03:00', '2026-04-20T01:00:00+03:00'],
      ['2026-05-17T21:00:00+03:00', '2026-05-18T01:00:00+03:00'],
      ['2026-06-14T21:00:00+03:00', '2026-06-15T01:00:00+03:00'],
      ['2026-07-12T21:00:00+03:00', '2026-07-13T01:00:00+03:00'],
      ['2026-08-09T21:00:00+03:00', '2026-08-10T01:00:00+03:00'],
      ['2026-09-06T21:00:00+03:00', '2026-09-07T01:00:00+03:00'],
      ['2026-10-04T21:00:00+03:00', '2026-10-05T01:00:00+03:00'],
      ['2026-11-01T22:00:00+03:00', '2026-11-02T02:00:00+03:00']
    ]

    // Marmara fishing only (Europe slots). Sep 2026 forum + March wiki leftovers.
    var marmaraFish = [
      { date: '2026-03-08', slot: 1 },
      { date: '2026-03-14', slot: 2 },
      { date: '2026-03-28', slot: 1 },
      { date: '2026-09-05', slot: 2 },
      { date: '2026-09-13', slot: 2 },
      { date: '2026-09-20', slot: 1 }
    ]

    function upcomingCharon(now, lang) {
      var out = []
      var seen = {}
      for (var i = 0; i < 90 && out.length < MAX; i++) {
        var probe = new Date(now + i * 86400000)
        var b = berlinYmd(probe)
        var key = b.y + '-' + b.m + '-' + b.day
        if (seen[key]) continue
        if (b.wd === 'Wed') {
          seen[key] = 1
          var ws = europeLocalToDate(b.y, b.m, b.day, 2, 0)
          var we = europeLocalToDate(b.y, b.m, b.day, 14, 0)
          if (we.getTime() > now) {
            out.push({
              title: lang === 'en'
                ? 'Fishing — Wednesday 02:00–14:00 Europe'
                : 'Balıkçılık — Çarşamba 02:00–14:00 Avrupa',
              start: ws,
              end: we
            })
          }
        } else if (b.wd === 'Sat') {
          seen[key] = 1
          var ss = europeLocalToDate(b.y, b.m, b.day, 14, 0)
          var se = europeLocalToDate(b.y, b.m, b.day, 18, 0)
          if (se.getTime() > now) {
            out.push({
              title: lang === 'en'
                ? 'Fishing — Saturday 14:00–18:00 Europe'
                : 'Balıkçılık — Cumartesi 14:00–18:00 Avrupa',
              start: ss,
              end: se
            })
          }
        }
      }
      return out.sort(function (a, b) { return a.start - b.start })
    }

    function upcomingEzel(now, lang) {
      var label = lang === 'en' ? 'Fishing' : 'Balıkçılık'
      return ezel.map(function (pair) {
        return { title: label, start: new Date(pair[0]), end: new Date(pair[1]) }
      }).filter(function (e) { return e.end.getTime() > now })
        .sort(function (a, b) { return a.start - b.start })
    }

    function upcomingMarmara(now, lang) {
      return marmaraFish.map(function (row) {
        var p = row.date.split('-').map(Number)
        var h0 = row.slot === 1 ? 16 : 20
        var start = europeLocalToDate(p[0], p[1], p[2], h0, 0)
        var end = row.slot === 1
          ? europeLocalToDate(p[0], p[1], p[2], 20, 0)
          : new Date(europeLocalToDate(p[0], p[1], p[2], 0, 0).getTime() + 86400000)
        var eu = row.slot === 1 ? '16:00–20:00' : '20:00–24:00'
        return {
          title: lang === 'en'
            ? 'Fishing — ' + eu + ' Europe'
            : 'Balıkçılık — ' + eu + ' Avrupa',
          start: start,
          end: end
        }
      }).filter(function (e) { return e.end.getTime() > now })
        .sort(function (a, b) { return a.start - b.start })
    }

    function render() {
      var lang = (window.FJLang && window.FJLang.get()) || 'tr'
      var now = Date.now()
      fill(document.getElementById('ezel-list'), upcomingEzel(now, lang), now, lang)
      fill(document.getElementById('marmara-list'), upcomingMarmara(now, lang), now, lang)
      fill(document.getElementById('charon-list'), upcomingCharon(now, lang), now, lang)
    }

    function tick() {
      var lang = (window.FJLang && window.FJLang.get()) || 'tr'
      var now = Date.now()
      document.querySelectorAll('.countdown').forEach(function (el) {
        el.textContent = countdownText(+el.getAttribute('data-start'), +el.getAttribute('data-end'), now, lang)
      })
    }

    document.addEventListener('DOMContentLoaded', function () {
      render()
      setInterval(tick, 1000)
    })
    window.addEventListener('fj-lang', render)
  })()
  </script>
</body>
</html>
